# Node 22, and not by preference: better-sqlite3@13 declares `engines: { node: ">=22" }`.
# Built or loaded against an older ABI it does not fail politely — it segfaults, killing the
# process before any JavaScript runs and therefore before anything can be logged. The only
# trace was a restart loop containing nothing but npm echoing the start script, and the
# actual cause sat in the *build* log as an EBADENGINE warning, not the deploy log.
#
# package.json `engines` says the same thing, so the build image and the run image agree.
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

# devDependencies are needed to *build* (typescript), not to run.
[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

# TypeScript is compiled here rather than at boot: running a transpiler in production is
# slower and is one more thing that can fail where nothing is watching.
[phases.build]
cmds = ["npm run build"]
