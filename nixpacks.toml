# better-sqlite3 ships prebuilt binaries for linux-x64 on Node 20, so this toolchain is a
# fallback for the case where no prebuild matches rather than the normal path. python3 and
# gcc are cheap to keep and turn a hard build failure into a slower build.
[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

# devDependencies are needed to *build* (typescript), not to run.
[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

# TypeScript is compiled here rather than at boot. Running `tsx` in production shipped a
# transpiler to the server and did the whole compile inside the container's first seconds,
# which is both slower and one more thing that can fail where nothing is watching.
# `npm start` is now plain `node dist/server.js`.
[phases.build]
cmds = ["npm run build"]
